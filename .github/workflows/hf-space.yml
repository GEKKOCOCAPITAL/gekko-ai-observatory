name: deploy-nicegui-to-hf-space
# Pushes the NiceGUI dashboard to the Hugging Face Space on every push to main.
# Needs the repository secret HF_TOKEN (Hugging Face write token) and the variable HF_SPACE (e.g. user/gekko-ai-observatory).
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
      - name: Build Space folder and push
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          set -e
          mkdir -p space/app space/docs/assets space/outputs
          cp -r luxfin_ai config data space/
          cp app/nicegui_app.py space/app/
          cp docs/assets/gekko_logo_crop.png space/docs/assets/
          cp outputs/validation_results.csv space/outputs/
          cp requirements-nicegui.txt LICENSE space/
          cp Dockerfile.nicegui space/Dockerfile
          cat > space/README.md <<'MD'
          ---
          title: GEKKO-AI Observatory
          emoji: 📊
          colorFrom: yellow
          colorTo: gray
          sdk: docker
          app_port: 7860
          pinned: false
          license: apache-2.0
          short_description: AI impacts, scenarios and risks for Luxembourg finance
          ---
          GEKKO-AI Observatory dashboard (NiceGUI), deployed automatically from GitHub. Gekko & Co. Capital SCSp.
          MD
          sed -i 's/^          //' space/README.md
          cd space
          git init -q -b main
          git lfs install --local
          git lfs track "*.png" "*.jpg" "*.pdf"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy from GitHub ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
