[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gekko-ai-observatory"
version = "0.9.0"
description = "LuxFin-AI Observatory: AI exposure, adoption, impact scenarios and risk scoring for Luxembourg's financial sector (prototype)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Gekko & Co. Capital SCSp"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "pyyaml>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8"]

[project.scripts]
luxfin = "luxfin_ai.cli:main"

[tool.setuptools]
packages = ["luxfin_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
